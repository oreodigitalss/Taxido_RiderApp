# Gradle memory and workers
# On this Windows machine Java's Unix-domain pipe implementation cannot create
# its loopback connection. Force TCP for Gradle's local IPC so builds can run.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djava.nio.channels.spi.SelectorProvider=sun.nio.ch.WindowsSelectorProvider
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.configureondemand=true
org.gradle.caching=true
org.gradle.daemon=false

# Android
android.useAndroidX=true
android.enableJetifier=true

# React Native
# Build the ABI used by current Android devices/emulators. Add other ABIs here
# only when distributing a multi-ABI APK.
reactNativeArchitectures=arm64-v8a
hermesEnabled=true
android.cxx.buildStagingDir=D\:/c

